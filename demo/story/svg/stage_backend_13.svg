orm:uppercase} .atlas-svg .chip-cut{opacity:.72} .atlas-svg .chip-text{pointer-events:none;font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;font-size:11.5px;font-weight:700} .atlas-svg .node[data-kind="step"]{--cat:#59b7a1}.atlas-svg .node[data-kind="decision"]{--cat:#7db6bd}.atlas-svg .node[data-kind="gate"]{--cat:#8aa6dd} .atlas-svg .node[data-kind="wait"]{--cat:#e2af69}.atlas-svg .node[data-kind="store"]{--cat:#52a9de}.atlas-svg .node[data-kind="external"]{--cat:#b598e8}.atlas-svg .node[data-kind="end"]{--cat:#9aa9b9}.atlas-svg .node[data-ending="back"] .node-box{stroke-dasharray:1.2 3.6;stroke-linecap:round} .atlas-svg .edge.inferred .edge-line{stroke-opacity:.6} .atlas-svg{--p-in:#35d39b;--p-out:#ffab40;--p-ink-in:#07241c;--p-ink-out:#2a1600} :root[data-theme=light] .atlas-svg{--p-in:#0b8f58;--p-out:#c25f00;--p-ink-in:#ffffff;--p-ink-out:#ffffff} .atlas-svg .portal{pointer-events:none} .atlas-svg .portal-ring{pointer-events:none;stroke-linecap:butt} .atlas-svg .pbadge{transform-box:fill-box;transform-origin:50% 50%;transform:scale(var(--pb-s,1));cursor:pointer} .atlas-svg .pb-n{pointer-events:none} .atlas-svg .pb-bg{stroke:var(--a-bg);stroke-width:1.6} .atlas-svg .pb-glyph{pointer-events:none} .atlas-svg .elabel-lead{stroke-width:1.4;fill:none;stroke-linecap:round;pointer-events:none} .atlas-svg .elabel-dot{pointer-events:none;stroke:var(--a-bg);stroke-width:1} .atlas-svg .pb-in{fill:color-mix(in srgb,var(--p-in) 16%,var(--a-node,#14252d))!important;stroke:var(--p-in);stroke-width:1.3} .atlas-svg .pb-out{fill:color-mix(in srgb,var(--p-out) 16%,var(--a-node,#14252d))!important;stroke:var(--p-out);stroke-width:1.3} .atlas-svg .pbadge .pb-glyph{stroke:currentColor} .atlas-svg .pbadge .pb-bg.pb-in~.pb-glyph{stroke:var(--p-in)!important} .atlas-svg .pbadge .pb-bg.pb-out~.pb-glyph{stroke:var(--p-out)!important} .atlas-svg .pbadge .pb-n{fill:var(--ink,#e8f1f3)!important}]]></style><defs><marker id="arr-forward" viewBox="0 0 12 12" refX="10.5" refY="6" 