<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="atlas-svg" viewBox="-20 -20 648.5 408" width="648.5" height="408" font-family="system-ui,Segoe UI,Helvetica,Arial,sans-serif"><title>Backend seam and Redis commands: Include path mapping</title><style><![CDATA[.atlas-svg{ --a-bg:#0d1a21;--a-node:#152a32;--a-ink:#ecf4f6;--a-muted:#c3d5db; --a-cl-fill:rgba(125,182,189,.06);--a-cl-line:#2e4a56;--a-cl-ink:#8fb0ba; --a-forward:#8fb0ba;--a-deliver:#5fb4ee;--a-record:#bda2e5;--a-return:#ec8f86; --a-pill:#1e3a46;--a-dimgrey:#8da5af; --ew:1.9px; background:var(--a-bg); } :root[data-theme=light] .atlas-svg{ --a-bg:#eef3f4;--a-node:#ffffff;--a-ink:#17303b;--a-muted:#3d5863; --a-cl-fill:rgba(20,70,80,.045);--a-cl-line:#b9ccd1;--a-cl-ink:#456570; --a-forward:#58808e;--a-deliver:#1f7bc4;--a-record:#7c52c4;--a-return:#cf4a3f; --a-pill:#ffffff;--a-dimgrey:#3a5560; } .atlas-svg .node-box{fill:var(--a-node);stroke-width:1.8} .atlas-svg .node-text{fill:var(--a-ink);font-size:var(--nf,15px);font-weight:550;pointer-events:none} .atlas-svg .edge-line{fill:none;stroke-width:var(--ew);stroke-linejoin:round;stroke-linecap:round} .atlas-svg .edge-hit{fill:none;stroke:transparent;stroke-width:var(--hit,14px);pointer-events:stroke} .atlas-svg .e-forward .edge-line{stroke:var(--a-forward)} .atlas-svg .e-deliver .edge-line{stroke:var(--a-deliver)} .atlas-svg .e-record .edge-line{stroke:var(--a-record)} .atlas-svg .e-return .edge-line{stroke:var(--a-return)} .atlas-svg marker#arr-forward path{fill:var(--a-forward)} .atlas-svg marker#arr-deliver path{fill:var(--a-deliver)} .atlas-svg marker#arr-record path{fill:var(--a-record)} .atlas-svg marker#arr-return path{fill:var(--a-return)} .atlas-svg .elabel-bg{fill:var(--a-bg);opacity:.93} .atlas-svg .elabel-text{fill:var(--a-muted);font-size:13px} .atlas-svg .cluster-box{fill:var(--a-cl-fill);stroke:var(--a-cl-line);stroke-width:1.2} .atlas-svg .cluster-title{fill:var(--a-cl-ink);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase} 